<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1715">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Llavero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script>
  // Decide el diseño según el DISPOSITIVO, no solo el ancho: celulares y tablets chicas
  // usan movil.css aunque el navegador esté en "Sitio de escritorio".
  (function(){
    var h = document.documentElement;
    var ua = navigator.userAgent || "";
    var lado = Math.min(screen.width, screen.height);
    var esCel = /Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(ua) ||
                (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua) && lado < 700) ||
                (window.matchMedia && matchMedia("(pointer:coarse)").matches && lado <= 900);
    function aplicar(){
      var movil = esCel || window.innerWidth <= 860;
      h.classList.toggle("movil", movil);
      // Si el celular igual dibuja la página como si fuera una PC (viewport de ~980px),
      // se amplía todo para que quede del tamaño real de la pantalla.
      var escala = 1;
      if (esCel && screen.width && window.innerWidth > screen.width * 1.3) escala = window.innerWidth / screen.width;
      h.style.zoom = escala > 1 ? escala : "";
    }
    aplicar();
    window.addEventListener("resize", aplicar);
    window.addEventListener("orientationchange", aplicar);
  })();
</script>
<link rel="stylesheet" href="/styles.css?v=4">
<link rel="stylesheet" href="/movil.css?v=4">
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <header class="side-head">
      <div>
        <p class="marca">LLAVERO</p>
        <h1 id="sideTitulo">Notas</h1>
      </div>
      <div class="side-acciones">
        <button class="icono" id="btnMenu" title="Más opciones" aria-label="Más opciones">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <button class="icono solo-pc" id="btnPanel" title="Ocultar panel" aria-label="Ocultar panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>
    </header>

    <p class="saludo" id="saludo" hidden></p>

    <div class="tabs caja">
      <button class="tab activa" data-tab="notas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        Notas
      </button>
      <button class="tab" data-tab="tareas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M11 6h10M11 12h10M11 18h10"/></svg>
        Tareas
      </button>
    </div>

    <div class="buscar caja">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="buscador" placeholder="Buscar" autocomplete="off">
    </div>

    <div class="crear caja">
      <button class="btn-crear" id="btnCrear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
        <span id="txtCrear">Crear nota</span>
      </button>
      <button class="icono" id="btnCrearMas" aria-label="Más formas de crear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="secciones">
      <section class="seccion caja" data-sec="fijadas">
        <header class="sec-head">
          <button class="icono chico plegar" aria-label="Plegar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <h2>Fijadas</h2>
          <button class="icono chico orden" aria-label="Ordenar"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
        </header>
        <ul class="lista" id="listaFijadas"></ul>
        <p class="vacia" id="vaciaFijadas">Nada fijado</p>
      </section>

      <section class="seccion caja" data-sec="todas">
        <header class="sec-head">
          <button class="icono chico plegar" aria-label="Plegar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <h2 id="tituloTodas">Notas</h2>
          <button class="icono chico orden" aria-label="Ordenar"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
        </header>
        <ul class="lista" id="listaTodas"></ul>
        <p class="vacia" id="vaciaTodas">Todavía no hay notas</p>
      </section>
    </div>
  </aside>

  <!-- ============ PRINCIPAL ============ -->
  <main class="principal" id="principal">
    <button class="icono btn-abrir-panel" id="btnAbrirPanel" title="Mostrar panel" aria-label="Mostrar panel" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
    </button>

    <!-- Vacío -->
    <section class="vacio" id="vistaVacia">
      <h1 class="titulo-pagina" id="tituloPagina">Notas</h1>
      <div class="vacio-centro">
        <div class="vacio-icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        </div>
        <h2 id="vacioTitulo">Todavía no hay notas</h2>
        <p id="vacioSub">Escribí ahora. Organizá después.</p>
        <button class="btn-acento" id="btnCrearVacio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span id="txtCrearVacio">Crear nota</span>
        </button>
      </div>
    </section>

    <!-- Editor -->
    <section class="editor" id="vistaEditor" hidden>
      <header class="ed-head">
        <button class="icono solo-movil" id="btnVolver" aria-label="Volver">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="ed-fecha" id="edFecha"></span>
        <div class="ed-acciones">
          <button class="icono" id="btnFijar" title="Fijar" aria-label="Fijar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
          </button>
          <button class="icono" id="btnZen" title="Modo lectura" aria-label="Modo lectura">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icono" id="btnNotaMenu" title="Más" aria-label="Más">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
        </div>
      </header>

      <div class="ed-hoja">
        <input type="text" id="edTitulo" class="ed-titulo" placeholder="Sin título" autocomplete="off">

        <div class="toolbar" id="toolbar">
          <button data-cmd="bold" title="Negrita"><b>B</b></button>
          <button data-cmd="italic" title="Cursiva"><i>I</i></button>
          <button data-cmd="underline" title="Subrayado"><u>U</u></button>
          <button data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
          <span class="sep"></span>
          <button data-block="H2" title="Título">H</button>
          <button data-cmd="insertUnorderedList" title="Lista">•</button>
          <button data-cmd="insertOrderedList" title="Lista numerada">1.</button>
          <button data-block="BLOCKQUOTE" title="Cita">❝</button>
          <span class="sep"></span>
          <button id="tbFoto" title="Agregar foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
          </button>
          <button id="tbAudio" title="Grabar audio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button id="tbDictar" title="Dictar (voz a texto)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M4 12h7M4 17h5"/><rect x="15" y="9" width="5" height="8" rx="2.5"/></svg>
          </button>
        </div>

        <!-- Nota -->
        <div id="edCuerpo" class="ed-cuerpo" contenteditable="true" data-placeholder="Empezá a escribir…"></div>

        <!-- Tarea -->
        <div id="edTareas" class="ed-tareas" hidden>
          <ul id="items" class="items"></ul>
          <form class="nuevo-item" id="formItem">
            <span class="check falso"></span>
            <input type="text" id="nuevoItem" placeholder="Agregar tarea" autocomplete="off">
          </form>
        </div>

        <div class="adjuntos" id="adjuntos"></div>
      </div>
    </section>
  </main>
</div>

<!-- ============ NAV INFERIOR ============ -->
<nav class="nav" id="nav">
  <button class="nav-btn activo" data-tab="notas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
    <span>Notas</span>
  </button>
  <button class="grabar" id="btnGrabar" aria-label="Grabar y agendar en Google Calendar">
    <svg class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span class="ico-stop"></span>
  </button>
  <button class="nav-btn" data-tab="tareas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M11 6h10M11 12h10M11 18h10"/></svg>
    <span>Tareas</span>
  </button>
</nav>

<!-- ============ BIENVENIDA ============ -->
<div class="bienvenida caja" id="bienvenida" hidden>
  <p class="marca">LLAVERO</p>
  <h3>Hacé tuyo este rincón</h3>
  <p class="bien-sub">Escribí tu nombre y Llavero te va a saludar en este dispositivo.</p>
  <input type="text" id="inpNombre" placeholder="Tu nombre" autocomplete="given-name">
  <label class="bien-check"><input type="checkbox" id="chkSinNombre"> No quiero poner mi nombre</label>
  <div class="bien-botones">
    <button class="btn-sec ancho" id="btnGuardarNombre">Guardar</button>
    <button class="btn-sec" id="btnOmitir">Omitir</button>
  </div>
</div>

<!-- ============ MENÚ FLOTANTE ============ -->
<div class="menu" id="menu" hidden></div>

<!-- ============ AVISO ============ -->
<div class="aviso" id="aviso" role="status"></div>

<input type="file" id="inpFoto" accept="image/*" hidden>
<input type="file" id="inpImportar" accept="application/json" hidden>

<script src="/app.js?v=4"></script>
</body>
</html>
