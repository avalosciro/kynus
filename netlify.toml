# Netlify sirve TODO el sitio desde un solo dominio:
#   /            → presentación
#   /app         → la aplicación
#   /guia        → guía para quienes prueban Kynus
#   /audio, /transcribir → el servidor (por ahora en Render; se reenvían sin que cambie la dirección)
#   El calendario NO pasa por el servidor: cada usuario agenda en el suyo desde el celular.
#
# El mismo repositorio sigue funcionando en Render sin tocar nada.

[build]
  # Se arma una carpeta "dist" sólo con lo que es público (sin app.py, zips, claves, etc.)
  command = "bash armar_sitio.sh"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/presentacion/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/guia"
  to = "/guia/index.html"
  status = 200

# --- Servidor (Render). Para migrar el servidor a Netlify, estas reglas se reemplazan por funciones. ---
[[redirects]]
  from = "/audio"
  to = "https://llavero-remil-nashe.onrender.com/audio"
  status = 200
  force = true

[[redirects]]
  from = "/transcribir"
  to = "https://llavero-remil-nashe.onrender.com/transcribir"
  status = 200
  force = true
